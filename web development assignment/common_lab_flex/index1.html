
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
        }

        /* Navigation Bar */
        .navbar {
            width: 100%;
            height: 88px;
            display: flex;
            align-items: center;
            padding: 0 4%;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
            gap: 25px;
        }

        /* Logo */
        .logo {
            width: 120px;
            flex-shrink: 0;
        }

        .logo img {
            width: 55px;
            height: auto;
            display: block;
        }

        /* Menu */
        .menu {
            display: flex;
            align-items: center;
            gap: 38px;
            white-space: nowrap;
        }

        .menu a {
            text-decoration: none;
            color: #282c3f;
            font-size: 15px;
            font-weight: bold;
            position: relative;
        }

        .menu a:hover {
            border-bottom: 3px solid #ff3f6c;
            padding-bottom: 10px;
        }

        .new {
            color: #ff3f6c;
            font-size: 10px;
            position: absolute;
            top: -7px;
            right: -23px;
        }

        /* Search Bar */
        .search {
            flex: 1;
            min-width: 100px;
            height: 44px;
            margin-left: auto;
            display: flex;
            align-items: center;
            background-color: #f5f5f6;
            border-radius: 5px;
            padding: 0 15px;
        }

        .search-icon {
            font-size: 20px;
            color: #696e79;
            margin-right: 25px;
        }

        .search input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
        }

        /* Right-side icons */
        .actions {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-left: 25px;
        }

        .action {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: #111;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
        }

        .action .icon {
            font-size: 23px;
            font-weight: normal;
            line-height: 25px;
        }

        /* Responsive Design */
        @media (max-width: 1100px) {
            .navbar {
                gap: 15px;
                padding: 0 2%;
            }

            .logo {
                width: 65px;
            }

            .menu {
                gap: 18px;
            }

            .menu a {
                font-size: 12px;
            }

            .actions {
                gap: 15px;
                margin-left: 10px;
            }
        }

        @media (max-width: 750px) {
            .navbar {
                height: auto;
                min-height: 75px;
                flex-wrap: wrap;
                padding: 15px;
                gap: 18px;
            }

            .logo {
                width: 50px;
            }

            .menu {
                flex: 1;
                justify-content: space-between;
                gap: 12px;
                overflow-x: auto;
            }

            .search {
                order: 3;
                flex-basis: 100%;
                margin: 0;
            }

            .actions {
                margin-left: auto;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <!-- Logo -->
        <div class="logo">
            <img
                src="https://upload.wikimedia.org/wikipedia/commons/b/bc/Myntra_Logo.png"
                alt="Myntra Logo">
        </div>

        <!-- Navigation Menu -->
        <div class="menu">
            <a href="#">MEN</a>
            <a href="#">WOMEN</a>
            <a href="#">KIDS</a>
            <a href="#">HOME</a>
            <a href="#">BEAUTY</a>
            <a href="#">GENZ</a>
            <a href="#">STUDIO <span class="new">NEW</span></a>
        </div>

        <!-- Search Bar -->
        <div class="search">
            <span class="search-icon">&#9906;</span>
            <input
                type="text"
                placeholder="Search for products, brands and more">
        </div>

        <!-- Profile, Wishlist and Bag -->
        <div class="actions">

            <div class="action">
                <span class="icon">&#9818;</span>
                <span>Profile</span>
            </div>

            <div class="action">
                <span class="icon">&#9825;</span>
                <span>Wishlist</span>
            </div>

            <div class="action">
                <span class="icon">&#128717;</span>
                <span>Bag</span>
            </div>

        </div>

    </nav>

</body>
</html>
