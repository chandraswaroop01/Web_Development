<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Course Enrollment</title>
</head>
<body>
  <h1>Technical Course Enrollment</h1>
  <p>Welcome to our education platform! Please complete the registration form below to enroll in your chosen technical course. This information helps us tailor your learning experience.</p>

  <!-- Course Information Link and Image -->
  <p>Learn more about our courses <a href="https://example.com/course-info" target="_blank">here</a>.</p>
  <img src="https://via.placeholder.com/400x200" alt="Course Information Banner">

  <!-- Enrollment Form -->
  <form action="/submit-registration" method="post">
    <!-- Account Information -->
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="student_name" required minlength="2" maxlength="50" placeholder="Enter your full name"><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="student_email" required placeholder="Enter your email"><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="student_password" required minlength="8" maxlength="20" placeholder="Choose a strong password"><br><br>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="student_mobile" required pattern="[0-9]{10}" title="Enter 10-digit number" placeholder="10-digit mobile number"><br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="student_dob" required><br><br>

    <!-- Course Selection -->
    <label for="course">Select Course:</label>
    <select id="course" name="course" required>
      <option value="">--Choose a Course--</option>
      <option value="java_dev">Java Development</option>
      <option value="python_prog">Python Programming</option>
      <option value="web_dev">Web Development</option>
      <option value="data_structures">Data Structures</option>
      <option value="database_mgmt">Database Management</option>
      <option value="cloud_computing">Cloud Computing</option>
    </select><br><br>

    <!-- Batch/Session Selection -->
    <label for="batch">Select Batch/Session:</label>
    <select id="batch" name="batch" required>
      <option value="">--Choose a Batch--</option>
      <option value="morning">Morning (9 AM - 12 PM)</option>
      <option value="afternoon">Afternoon (1 PM - 4 PM)</option>
      <option value="evening">Evening (5 PM - 8 PM)</option>
      <option value="weekend">Weekend (Sat-Sun)</option>
    </select><br><br>

    <!-- Learning Preference -->
    <label>Learning Mode:</label><br>
    <input type="radio" id="online" name="learning_mode" value="online" required>
    <label for="online">Online</label><br>
    <input type="radio" id="offline" name="learning_mode" value="offline">
    <label for="offline">Offline</label><br>
    <input type="radio" id="hybrid" name="learning_mode" value="hybrid">
    <label for="hybrid">Hybrid</label><br><br>

    <!-- Areas of Interest -->
    <label>Areas of Interest:</label><br>
    <input type="checkbox" id="java" name="interest_java" value="java">
    <label for="java">Java</label><br>
    <input type="checkbox" id="python" name="interest_python" value="python">
    <label for="python">Python</label><br>
    <input type="checkbox" id="web" name="interest_web" value="web">
    <label for="web">Web Development</label><br>
    <input type="checkbox" id="ds" name="interest_ds" value="ds">
    <label for="ds">Data Structures</label><br>
    <input type="checkbox" id="db" name="interest_db" value="db">
    <label for="db">Database</label><br><br>

    <!-- Education Background -->
    <label for="education">Education Level:</label>
    <input type="text" id="education" name="education_level" required placeholder="e.g., Bachelor's, Master's"><br><br>

    <label for="college">College/Institution:</label>
    <input type="text" id="college" name="college_name" required minlength="2" maxlength="100" placeholder="Enter your institution name"><br><br>

    <label for="semester">Current Semester/Year:</label>
    <input type="text" id="semester" name="semester_year" required placeholder="e.g., 3rd Year, 5th Semester"><br><br>

    <!-- Programming Experience -->
    <label for="experience">Programming Experience (years):</label>
    <input type="number" id="experience" name="experience_years" min="0" max="20" step="1" required><br><br>

    <!-- Portfolio -->
    <label for="portfolio">GitHub/Portfolio URL (optional):</label>
    <input type="url" id="portfolio" name="portfolio_url" placeholder="https://github.com/username"><br><br>

    <!-- Learning Goals -->
    <label for="goals">Learning Goals:</label><br>
    <textarea id="goals" name="learning_goals" rows="4" cols="50" required minlength="10" maxlength="500" placeholder="Describe your learning objectives"></textarea><br><br>

    <!-- Confirmation -->
    <input type="checkbox" id="confirm" name="confirm" required>
    <label for="confirm">I confirm that the information provided is accurate.</label><br><br>

    <!-- Controls -->
    <input type="submit" value="Submit Registration">
    <input type="reset" value="Reset Form">
  </form>
</body>
</html>
