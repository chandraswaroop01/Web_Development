<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>college addmition form</title>
</head>
<body>
      
       <h1><center><mark>COLLEGE ADMISSION APPLICATION FORM</mark></center></h1>
         <P>   
     <h2>welcome to our college admission portal <br> be carefull while filling the form!
    </h2>  
        </P>
          <hr>
<form action="/submit-admission" method="post" enctype="multipart/form-data"></form>
 <fieldset>
 <legend>personal informationl </legend>
  
   <label for="Full Name">Full Name*</label>
   <input type="text" name="Full Name" id="Full Name" required> <br><br>

   <label for="dob">Date Of Birth*</label>
   <input type="date" name="dob" id="dob" required><br><br>

   <label for="e-mail">e-mail*</label>
   <input type="email" id="email" name="e-mail" placeholder="example@gmail.com" required><br><br>
                                                
   <label for="mobile">Mobile Number*</label>
   <input type="tel" name="mobile" id="mobile" placeholder="enter 10-digit number" required><br><br>

   <label for="pin">Application pin / password*</label>
   <input type="password" name="pin" id="pin" required><br><br>

 <form>

  <p>Gender*</p>
  
  <label for="Male">Male</label>
  <input type="radio" name="Gender" id="male" required>

  <label for="female">Female</label>
  <input type="radio" name="Gender" id="female" required>

  <label for="others">Others</label>
  <input type="radio" name="Gender" id="others" required><br><br>
   
 <label for="catogery">catogery*</label>
 <select name="catogery" name="catogery">
<option value="GENERAL">GENERAL</option>
<option value="OBC">OBC</option>
<option value="ST">ST</option>
<option value="SC">SC</option>
<option value="EWS">ESW</option>
 </select><br><br>

 <label for="address">enter your address*</label>
 <textarea name="address" id="address" rows="4" coloums="50" required></textarea>

 </form>

</fieldset>

<fieldset>

  <legend>course selection</legend>
  
  <label for="course">Course*</label>
  <select name="course" id="course">
    <option value="">---select---</option>
    <option value="B-TECH">B-Tech</option>
    <option value="M-Tech">M-Tech</option>
    <option value="B.com">B.com</option>
    <option value="B.Arc">B.Arc</option>
    <option value="B.E">B.E</option> 

  </select>

  <p>Mode Of Study*</p>

  <label for="Regular">Regular</label>
  <input type="radio" name="mode" id="Regular">

  <label for="Distance">Distance</label>
  <input type="radio" name="mode" id="Distance">

  <p>Prefered subjects*</p>
    <label for="Mathematices">Mathematices</label>
    <input type="checkbox" name="subjects" id="Mathematices">
  
  <label for="Physics">Physics</label>
  <input type="checkbox" name="subjects" id="Physics">

  <label for="litareture">Litarature</label>
  <input type="checkbox" name="subjects" id="litarature" required>

  <label for="Economics">Ecanomics</label>
  <input type="checkbox" name="subjects" id="Economics" required>

</fieldset>

<fieldset>
<legend>ACADEMIC INFORMATION</legend>

<label for="previous Qualification">Previous Qualification*</label><br>
<input type="text" name="Previous Qualification" id="Previous Qualification" required><br><br>

<label for="Percentage">Percentage/CGPA *</label><br>
<input type="text" name="percentage" id="percentage" required><br><br>

<label for="passing year">Passing year*</label><br>
<input type="text" name="passing year" id="passing year" required><br><br>

<label for="School/college Name">School/college Name*</label><br>
<input type="text" name="School/college Name" id="School/college Name" required>

</fieldset>

<fieldset>
<legend>Documents</legend>

<label for="Upload Documents">Upload Documents*</label><br>
<input type="file" name="choose " id="Upload Documents" required>

</fieldset>

<fieldset>
<legend>Declaration*</legend>
 
<input type="checkbox" name="consent" id="consent" value="agree">
<label for="consent"> I hereby declare that the information provided is true to the best of my knowledge.</label>


</fieldset>

 <input type="submit" value="Submit Application">
    <input type="reset" value="Reset Form">
  </form>



</form>


</body>
</html>
